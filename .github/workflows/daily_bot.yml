name: Bot Notificador Diario Myselft

on:
  schedule:
    # 07:00 UTC equivale a las 08:00 AM en hora peninsular de España (CET)
    - cron: '0 7 * * *'
  workflow_dispatch: # Botón para probar el envío manual desde GitHub

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Ejecutar script de Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notificar.py