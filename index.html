<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myself — Workspace PC</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-container">
    <!-- Encabezado Principal -->
    <header class="app-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <h1 style="font-size: 1.25rem; font-weight: 800; color: var(--accent-primary);">Myself</h1>
        <span style="font-size: 0.8rem; background: var(--bg-today); color: var(--text-today); padding: 2px 8px; border-radius: 12px; font-weight: 600;">PC Edition</span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <button id="btn-theme-toggle" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-primary); cursor: pointer; font-size: 1rem;" title="Cambiar Modo Noche/Día">🌙</button>
        <button id="btn-today" class="btn-today" style="padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-primary); cursor: pointer; font-weight: 600;">Hoy (T)</button>
        <div style="display: flex; gap: 4px;">
          <button id="btn-prev-week" class="btn-prev" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-primary); cursor: pointer;">←</button>
          <button id="btn-next-week" class="btn-next" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-primary); cursor: pointer;">→</button>
        </div>
        <button id="btn-add-task" class="btn-add" style="padding: 8px 16px; border-radius: 8px; background: var(--accent-primary); color: #fff; border: none; cursor: pointer; font-weight: 600;">+ Nueva Tarea (N)</button>
        <button id="btn-open-settings" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-primary); cursor: pointer;">⚙️</button>
      </div>
    </header>

    <!-- Contenedor Multipanel 2 Columnas -->
    <div class="main-content-wrapper">
      
      <!-- COLUMNA IZQUIERDA: Calendario Semanal -->
      <main class="calendar-main-column">
        <div class="week-grid-wrapper">
          <div id="calendar-grid-header" class="grid-header-row">
            <!-- Días de la semana -->
          </div>
          <div id="calendar-grid-body" class="grid-body-scroll">
            <!-- Horas y columnas por día -->
          </div>
        </div>
      </main>

      <!-- COLUMNA DERECHA: Panel Lateral Permanente -->
      <aside class="desktop-side-panel">
        
        <!-- 1. Rutinas Habituales -->
        <div class="side-card">
          <div class="side-card-title">
            🔄 Rutinas Habituales
            <button id="btn-open-habitual-modal" style="font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; background: var(--accent-primary); color: #fff; border: none; cursor: pointer; font-weight: 600;">+ Crear</button>
          </div>
          <div id="side-habitual-list" style="display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem;">
            <!-- Se inserta dinámicamente -->
          </div>
        </div>

        <!-- 2. Bloc de Notas Rápido -->
        <div class="side-card">
          <div class="side-card-title">
            📝 Bloc de Notas Rápido
            <span id="notes-saved-status" style="font-size: 0.75rem; color: #10b981; opacity: 0; transition: opacity 0.3s; font-weight: 600;">Guardado</span>
          </div>
          <textarea id="desktop-quick-notes" class="quick-notes-area" placeholder="Escribe notas, enlaces o pendientes rápidos aquí..."></textarea>
        </div>

        <!-- 3. Leyenda de Categorías y Atajos -->
        <div class="side-card" style="background: var(--bg-primary);">
          <div class="side-card-title" style="margin-bottom: 8px;">
            🏷️ Categorías
          </div>
          <div style="font-size: 0.8rem; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;">
            <span style="display:flex; align-items:center; gap:8px;"><span style="width:12px; height:12px; border-radius:3px; background:#2563eb; display:inline-block;"></span> Personal</span>
            <span style="display:flex; align-items:center; gap:8px;"><span style="width:12px; height:12px; border-radius:3px; background:#10b981; display:inline-block;"></span> Estudios</span>
            <span style="display:flex; align-items:center; gap:8px;"><span style="width:12px; height:12px; border-radius:3px; background:#9333ea; display:inline-block;"></span> Rutina Habitual</span>
          </div>

          <div class="side-card-title" style="margin-bottom: 8px;">
            ⌨️ Atajos de Teclado
          </div>
          <div style="font-size: 0.8rem; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <span><kbd>N</kbd> Nueva Tarea</span>
            <span><kbd>T</kbd> Ir a Hoy</span>
            <span><kbd>←</kbd> Sem. Anterior</span>
            <span><kbd>→</kbd> Sem. Siguiente</span>
            <span><kbd>Esc</kbd> Cerrar Modal</span>
          </div>
        </div>

      </aside>
    </div>
  </div>

  <!-- MODAL: CREAR / EDITAR TAREA PUNTUAL -->
  <div id="modal-task" class="modal-backdrop hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 id="modal-task-header-title" style="font-size:1.2rem; font-weight:700;">Nueva Tarea</h2>
        <button id="btn-close-task-modal" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-primary);">✕</button>
      </div>
      <form id="form-task" style="display:flex; flex-direction:column; gap:14px;">
        <input type="hidden" id="task-id">
        
        <div>
          <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Título de la Tarea</label>
          <input type="text" id="task-title-input" required style="width:100%; padding:10px 12px; border-radius:8px; font-family:inherit;" placeholder="Ej. Examen de Redes">
        </div>

        <div>
          <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Categoría</label>
          <select id="task-category-input" style="width:100%; padding:9px 12px; border-radius:8px; font-family:inherit; cursor:pointer;">
            <option value="personal">👤 Personal (Azul)</option>
            <option value="estudios">📚 Estudios (Verde)</option>
          </select>
        </div>

        <div>
          <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Fecha</label>
          <input type="date" id="task-date-input" required style="width:100%; padding:8px 12px; border-radius:8px; font-family:inherit;">
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <div>
            <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Hora Inicio</label>
            <input type="time" id="task-start-input" required style="width:100%; padding:8px 12px; border-radius:8px; font-family:inherit;">
          </div>
          <div>
            <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Hora Fin</label>
            <input type="time" id="task-end-input" required style="width:100%; padding:8px 12px; border-radius:8px; font-family:inherit;">
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
          <button type="button" id="btn-delete-task" style="padding:8px 16px; border-radius:8px; background:#ef4444; color:#fff; border:none; cursor:pointer; font-weight:600; display:none;">Eliminar</button>
          <div style="display:flex; gap:8px; margin-left:auto;">
            <button type="button" id="btn-cancel-task" style="padding:8px 16px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-surface); color:var(--text-primary); cursor:pointer;">Cancelar</button>
            <button type="submit" style="padding:8px 16px; border-radius:8px; background:var(--accent-primary); color:#fff; border:none; cursor:pointer; font-weight:600;">Guardar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: GESTIONAR TAREA HABITUAL / RUTINA -->
  <div id="modal-habitual" class="modal-backdrop hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 id="modal-habitual-header-title" style="font-size:1.2rem; font-weight:700;">Nueva Rutina Habitual</h2>
        <button id="btn-close-habitual-modal" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-primary);">✕</button>
      </div>
      <form id="form-habitual" style="display:flex; flex-direction:column; gap:14px;">
        <input type="hidden" id="habitual-id">
        <div>
          <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Nombre de la Rutina</label>
          <input type="text" id="habitual-title-input" required style="width:100%; padding:10px 12px; border-radius:8px; font-family:inherit;" placeholder="Ej. Gimnasio, Clase de Sistemas...">
        </div>
        
        <div>
          <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Días de la Semana</label>
          <div class="day-chips-grid">
            <label class="day-chip"><span>L</span><input type="checkbox" name="habitual-day" value="1"></label>
            <label class="day-chip"><span>M</span><input type="checkbox" name="habitual-day" value="2"></label>
            <label class="day-chip"><span>X</span><input type="checkbox" name="habitual-day" value="3"></label>
            <label class="day-chip"><span>J</span><input type="checkbox" name="habitual-day" value="4"></label>
            <label class="day-chip"><span>V</span><input type="checkbox" name="habitual-day" value="5"></label>
            <label class="day-chip"><span>S</span><input type="checkbox" name="habitual-day" value="6"></label>
            <label class="day-chip"><span>D</span><input type="checkbox" name="habitual-day" value="0"></label>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <div>
            <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Hora Inicio</label>
            <input type="time" id="habitual-start-input" required value="10:00" style="width:100%; padding:8px 12px; border-radius:8px; font-family:inherit;">
          </div>
          <div>
            <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Hora Fin</label>
            <input type="time" id="habitual-end-input" required value="11:00" style="width:100%; padding:8px 12px; border-radius:8px; font-family:inherit;">
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
          <button type="button" id="btn-delete-habitual" style="padding:8px 16px; border-radius:8px; background:#ef4444; color:#fff; border:none; cursor:pointer; font-weight:600; display:none;">Eliminar</button>
          <div style="display:flex; gap:8px; margin-left:auto;">
            <button type="button" id="btn-cancel-habitual" style="padding:8px 16px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-surface); color:var(--text-primary); cursor:pointer;">Cancelar</button>
            <button type="submit" style="padding:8px 16px; border-radius:8px; background:var(--accent-primary); color:#fff; border:none; cursor:pointer; font-weight:600;">Guardar Rutina</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: AJUSTES -->
  <div id="modal-settings" class="modal-backdrop hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 style="font-size:1.2rem; font-weight:700;">Ajustes de Myself</h2>
        <button id="btn-close-settings" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-primary);">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <button id="btn-export-json" style="padding:10px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-surface); color:var(--text-primary); cursor:pointer;">💾 Exportar Copia de Seguridad (JSON)</button>
        <label style="padding:10px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-surface); color:var(--text-primary); cursor:pointer; text-align:center;">
          📂 Importar Copia de Seguridad (JSON)
          <input type="file" id="input-import-json" accept=".json" style="display:none;">
        </label>
        <button id="btn-enable-notifications" style="padding:10px; border-radius:8px; background:var(--accent-primary); color:#fff; border:none; cursor:pointer;">🔔 Activar Notificaciones Locales</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/app.js"></script>
</body>
</html>
