<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myself — Workspace PC</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-container">
    <!-- Encabezado Principal -->
    <header class="app-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <h1 style="font-size: 1.25rem; font-weight: 800; color: var(--accent-primary, #2563eb);">Myself</h1>
        <span style="font-size: 0.8rem; background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 12px; font-weight: 600;">PC Edition</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px;">
        <button id="btn-today" class="btn-today" style="padding: 8px 16px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; font-weight: 600;">Hoy (T)</button>
        <div style="display: flex; gap: 4px;">
          <button id="btn-prev-week" class="btn-prev" style="padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer;">←</button>
          <button id="btn-next-week" class="btn-next" style="padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer;">→</button>
        </div>
        <button id="btn-add-task" class="btn-add" style="padding: 8px 16px; border-radius: 8px; background: #2563eb; color: #fff; border: none; cursor: pointer; font-weight: 600;">+ Nueva Tarea (N)</button>
        <button id="btn-open-settings" style="padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer;">⚙️</button>
      </div>
    </header>

    <!-- Contenedor Multipanel 2 Columnas -->
    <div class="main-content-wrapper">
      
      <!-- COLUMNA IZQUIERDA: Calendario Semanal -->
      <main class="calendar-main-column">
        <div class="week-grid-wrapper">
          <div id="calendar-grid" class="week-grid">
            <!-- Se renderiza dinámicamente desde JS -->
          </div>
        </div>
      </main>

      <!-- COLUMNA DERECHA: Panel Lateral Permanente (Solo PC) -->
      <aside class="desktop-side-panel">
        
        <!-- 1. Guía de Atajos de Teclado -->
        <div class="side-card" style="background: #eff6ff; border-color: #bfdbfe;">
          <div class="side-card-title" style="color: #1e40af; margin-bottom: 8px;">
            ⌨️ Atajos de Teclado
          </div>
          <div style="font-size: 0.8rem; color: #1e3a8a; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <span><kbd>N</kbd> Nueva Tarea</span>
            <span><kbd>T</kbd> Ir a Hoy</span>
            <span><kbd>←</kbd> Sem. Anterior</span>
            <span><kbd>→</kbd> Sem. Siguiente</span>
            <span><kbd>Esc</kbd> Cerrar Modal</span>
          </div>
        </div>

        <!-- 2. Bloc de Notas Rápido con Autoguardado -->
        <div class="side-card">
          <div class="side-card-title">
            📝 Bloc de Notas Rápido
            <span id="notes-saved-status" style="font-size: 0.75rem; color: #10b981; opacity: 0; transition: opacity 0.3s; font-weight: 600;">Guardado</span>
          </div>
          <textarea id="desktop-quick-notes" class="quick-notes-area" placeholder="Escribe notas, enlaces o pendientes rápidos aquí..."></textarea>
        </div>

        <!-- 3. Tareas Pendientes del Día -->
        <div class="side-card">
          <div class="side-card-title">
            📌 Pendientes Rápidos
          </div>
          <div id="side-pending-list" style="display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; color: #64748b;">
            <p>No hay tareas pendientes en esta vista.</p>
          </div>
        </div>

      </aside>
    </div>
  </div>

  <!-- Modal de Ajustes -->
  <div id="modal-settings" class="modal-backdrop hidden">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 style="font-size:1.2rem; font-weight:700;">Ajustes de Myself</h2>
        <button id="btn-close-settings" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <button id="btn-export-json" style="padding:10px; border-radius:8px; border:1px solid #cbd5e1; background:#fff; cursor:pointer;">💾 Exportar Copia de Seguridad (JSON)</button>
        <label style="padding:10px; border-radius:8px; border:1px solid #cbd5e1; background:#fff; cursor:pointer; text-align:center;">
          📂 Importar Copia de Seguridad (JSON)
          <input type="file" id="input-import-json" accept=".json" style="display:none;">
        </label>
        <button id="btn-enable-notifications" style="padding:10px; border-radius:8px; background:#2563eb; color:#fff; border:none; cursor:pointer;">🔔 Activar Notificaciones Locales</button>
      </div>
    </div>
  </div>

  <!-- Iconos Lucide y Lógica Principal -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/app.js"></script>
</body>
</html>
